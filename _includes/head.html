<head>
	<meta charset="utf-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<base target="_blank">

	<title class="pageTitle">{{ site.page_title }}</title>
	<meta name="description" content="{{ site.app_description }}">

	<link rel="shortcut icon" href="{{ site.app_icon | relative_url }}">

	<!-- Smart App Banner -->
	{% if site.enable_smart_app_banner %}
		<meta name="apple-itunes-app" content="app-id={{ site.ios_app_id }}">
	{% endif %}

	<!-- Set theme before paint to avoid a flash of the wrong color scheme -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem('bk-theme');
				if (t === 'dark' || t === 'light') {
					document.documentElement.setAttribute('data-theme', t);
				}
			} catch (e) {}
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;1,400&display=swap">
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
	<link rel="stylesheet" href="{{ '/main.css' | relative_url }}">

	<meta property="og:type" content="website" />
	<meta property="og:title" content="{{ site.page_title }}" />
	<meta name="og:site_name" content="{{ site.page_title }}" />
	<meta property="og:description" content="{{ site.app_description }}" />
	<meta property="og:image" content="{{ site.og_image }}" />
	<meta property="og:url" content="{{ site.canonical_url }}" />

	<meta name="twitter:creator" content="@{{ site.twitter_username }}" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:image" content="{{ site.og_image }}" />
	<meta name="twitter:url" content="https://x.com/{{ site.twitter_username }}" />
</head>
