<!-- ================= FEATURES ================= -->
<section class="bk-features">
    <div class="bk-features__inner">
        <div class="bk-section-head">
            <span class="bk-eyebrow" data-reveal>{{ site.features_eyebrow }}</span>
            <h2 data-reveal>{{ site.features_title }}</h2>
            <p data-reveal>{{ site.features_subtitle }}</p>
        </div>
        <div class="bk-cards">
            {% for feature in site.features %}
                {% if feature.title %}
                    <div class="bk-card" data-reveal>
                        {% if feature.premium %}
                            <span class="bk-badge-premium">
                                <span class="material-symbols-outlined" style="font-size:14px">workspace_premium</span>Premium
                            </span>
                        {% endif %}
                        <span class="bk-card__icon">
                            <span class="material-symbols-outlined" style="font-size:28px">{{ feature.icon }}</span>
                        </span>
                        <h3>{{ feature.title }}</h3>
                        <p>{{ feature.description }}</p>
                    </div>
                {% endif %}
            {% endfor %}
        </div>
    </div>
</section>
